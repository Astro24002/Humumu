name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          JWT_SECRET: ci-test-secret-not-for-production
          HUMUMU_ENABLE_SCHEDULER: "0"
        run: |
          PYTHONPATH="$PWD" pytest tests/ -q --tb=short
