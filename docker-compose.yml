services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: journal_monitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DB_DSN: "postgresql+asyncpg://postgres:postgres@postgres:5432/journal_monitor"
      DB_DSN_SYNC: "postgresql://postgres:postgres@postgres:5432/journal_monitor"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      FETCH_INTERVAL_MINUTES: "${FETCH_INTERVAL_MINUTES:-30}"
      HUMUMU_ENABLE_SCHEDULER: "${HUMUMU_ENABLE_SCHEDULER:-1}"
      # Set to "1" to upsert journals + CAS facets after migrate.
      HUMUMU_SEED_JOURNALS: "${HUMUMU_SEED_JOURNALS:-0}"
      # Optional mail / WeChat — pass through from host .env when present.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      WECHAT_APPID: "${WECHAT_APPID:-}"
      WECHAT_SECRET: "${WECHAT_SECRET:-}"
      WECHAT_TEMPLATE_REALTIME: "${WECHAT_TEMPLATE_REALTIME:-}"
      WECHAT_TEMPLATE_DAILY: "${WECHAT_TEMPLATE_DAILY:-}"
      PUBLIC_APP_URL: "${PUBLIC_APP_URL:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./migrations:/app/migrations

volumes:
  pgdata:
